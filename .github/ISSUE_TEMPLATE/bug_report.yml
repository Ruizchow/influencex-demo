name: Bug report
description: Report a reproducible problem / 报告问题
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Expected behavior and actual behavior. English or Chinese is welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page and actions taken. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, browser, Node version, and local/Docker/Render deployment.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, passwords, emails and private creator data before uploading.
