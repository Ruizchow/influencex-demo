name: Feature request
description: Suggest a workflow improvement / 提出功能建议
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs this and the workflow. English or Chinese is welcome.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
